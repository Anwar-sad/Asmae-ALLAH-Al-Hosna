name: Build Android APK
'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: |
          if [ -f settings.gradle ] && [ -d app ]; then
            project=.
          elif [ -f asma-widget/settings.gradle ] && [ -d asma-widget/app ]; then
            project=asma-widget
          else
            echo 'Extract and upload the project source before running this workflow.'
            exit 1
          fi
          sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
          gradle -p "$project" :app:assembleDebug
          cp "$project/app/build/outputs/apk/debug/app-debug.apk" Asma-Al-Husna.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Asma-APK
          path: Asma-Al-Husna.apk
          if-no-files-found: error
